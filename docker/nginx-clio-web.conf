# nginx site for the clio-web container.
#
# Serves the static @clio/web bundle on :80 and reverse-proxies the GACT REST
# API (/v1/*) to the clio-agent-gact process on 127.0.0.1:7777. Because the
# browser talks to nginx and nginx talks to clio, the API is same-origin from
# the browser's point of view: no CORS, and no separate exposed clio port.

upstream clio_gact {
    server 127.0.0.1:7777;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- GACT API proxy (regular request/response) ------------------------
    # Everything under /v1 goes to clio. The SSE event stream has its own
    # location block below with buffering disabled.
    location /v1/ {
        proxy_pass http://clio_gact;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Pass through Authorization (optional CLIO_AUTH_TOKEN bearer).
        proxy_pass_request_headers on;
        proxy_read_timeout 300s;
    }

    # ---- SSE event stream -------------------------------------------------
    # GET /v1/sessions/{id}/events is text/event-stream. SSE through a proxy
    # requires: buffering OFF (so events flush immediately), HTTP/1.1, an
    # empty Connection header, and a long read timeout (the stream is idle
    # between events but must not be reaped).
    location ~ ^/v1/sessions/[^/]+/events$ {
        proxy_pass http://clio_gact;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Defensive: some intermediaries honor this hint to not buffer.
        add_header X-Accel-Buffering no;
    }

    # ---- static SPA -------------------------------------------------------
    # The web app is a single-page app; unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

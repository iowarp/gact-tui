[package]
name = "clio-desktop"
version = "0.7.3"
description = "CLIO Desktop — Tauri shell"
authors = ["IOWarp / gact-tui contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "clio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.0"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Auto-update: checks the GitHub-releases latest.json marker, verifies the
# minisign signature against the configured pubkey, downloads + installs.
tauri-plugin-updater = "2"
# Relaunch the app after an in-place update installs (the updater leaves the
# running process in place on macOS/Linux; `relaunch()` boots the new binary).
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lifecycle supervisor (Wave 0c) + the gact_http command (post-tag bridge)
rand = "0.8"
# default-features = false drops ureq's own default TLS backend, so "tls"
# (rustls) is what keeps https reachable: without it every https endpoint the UI
# accepts fails inside the bridge with an opaque transport error.
ureq = { version = "2.10", default-features = false, features = ["tls"] }
hex = "0.4"
libc = "0.2"
base64 = "0.22"
sha2 = "0.10"
# Embedded workspace terminal (Wave B9): ConPTY on Windows, real ptys on
# macOS/Linux, behind one cross-platform API.
portable-pty = "0.8"
glob = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
png = "0.18"
winreg = "0.55"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RestartManager", "Win32_System_SystemInformation", "Win32_System_Threading"] }
tar = "0.4"
zstd = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSFileManager", "NSObject", "NSString", "NSURL"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
gtk = "0.18"
gdk-pixbuf = "0.18"
keyring = { version = "3.6.3", default-features = false, features = ["async-secret-service", "crypto-rust", "tokio"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[package]
name = "clio-desktop"
version = "0.9.0"
description = "CLIO Desktop — Tauri shell"
authors = ["IOWarp / gact-tui contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "clio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lifecycle supervisor (Wave 0c) + the gact_http command (post-tag bridge)
rand = "0.8"
ureq = { version = "2.10", default-features = false }
hex = "0.4"
# Wave 3: SSH tunnel + OS keychain
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

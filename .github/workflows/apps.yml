name: apps

on:
  push:
    branches:
      - main
      - develop
      - feat/apps-harness
      - feat/apps-**
    paths:
      - 'apps/**'
      - '.github/workflows/apps.yml'
    tags:
      - 'clio-desktop-v*'
  pull_request:
    paths:
      - 'apps/**'
      - '.github/workflows/apps.yml'

env:
  PNPM_VERSION: '9.15.9'
  NODE_VERSION: '20.x'

jobs:
  ci:
    name: lint · typecheck · test · build · visual
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: apps/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      - name: Build @clio/web
        run: pnpm --filter @clio/web build

      - name: Install Playwright browsers
        run: pnpm --filter @clio/web exec playwright install --with-deps chromium

      - name: Visual tests
        run: pnpm --filter @clio/web test:visual

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apps-screenshots
          path: apps/web/screenshots/
          if-no-files-found: warn

  tauri-debug:
    name: tauri build (debug, no bundle)
    needs: ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    defaults:
      run:
        working-directory: apps

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: apps/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/src-tauri/target/
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ matrix.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-

      - name: Linux deps for Tauri
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            patchelf

      - name: pnpm install
        run: pnpm install --frozen-lockfile=false

      - name: Build web (Tauri frontend)
        run: pnpm --filter @clio/web build

      - name: Tauri debug build
        run: pnpm --filter @clio/desktop tauri:build:debug

  release:
    name: release · ${{ matrix.variant }} · ${{ matrix.os }} / ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/clio-desktop-v')
    needs: [ci, tauri-debug]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Cross-product: {lite, bundled} × 4 target triples = 8 jobs.
      # `variant` and `target` are real axes; `include` attaches os +
      # bundle-args keyed on `target` (matching an existing axis key
      # EXPANDS those combinations rather than adding standalone jobs).
      matrix:
        variant: [lite, bundled]
        target:
          - x86_64-pc-windows-msvc
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bundle-args: '--bundles msi,nsis'
          - target: aarch64-apple-darwin
            os: macos-14
            bundle-args: '--bundles dmg --target aarch64-apple-darwin'
          - target: x86_64-apple-darwin
            os: macos-13
            bundle-args: '--bundles dmg --target x86_64-apple-darwin'
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            bundle-args: '--bundles deb,appimage,rpm'
          # AppImage is LITE-ONLY on Linux. A half-gigabyte embedded Python
          # runtime inside AppImage's compressed read-only squashfs is the
          # wrong vehicle (and build_appimage.sh fails on it — 0.7.0 release
          # test, take 2). Offline Linux installs use the bundled deb/rpm.
          # This include matches variant+target and overrides bundle-args
          # for that one combination.
          - target: x86_64-unknown-linux-gnu
            variant: bundled
            bundle-args: '--bundles deb,rpm'

    defaults:
      run:
        working-directory: apps

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: apps/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Go (sidecar launcher build)
        uses: actions/setup-go@v5
        with:
          # Match the toolchain pinned in go.work and the TUI release workflow.
          go-version: '1.26.x'

      - name: Install uv (bundled runtime build)
        if: matrix.variant == 'bundled'
        uses: astral-sh/setup-uv@v5

      - name: Linux deps for Tauri
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            rpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile=false

      - name: Build sidecar launcher for target triple
        shell: bash
        run: bash apps/desktop/scripts/fetch-sidecar.sh ${{ matrix.target }}
        working-directory: ${{ github.workspace }}

      - name: Build embedded clio-agent runtime (bundled, macOS/Linux)
        if: matrix.variant == 'bundled' && matrix.os != 'windows-latest'
        shell: bash
        run: bash apps/desktop/scripts/build-clio-runtime.sh
        working-directory: ${{ github.workspace }}

      - name: Build embedded clio-agent runtime (bundled, Windows)
        if: matrix.variant == 'bundled' && matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/build-clio-runtime.ps1
        working-directory: apps/desktop

      - name: Build web (Tauri frontend)
        run: pnpm --filter @clio/web build

      - name: Tauri release build (unsigned)
        # NOTE: the tauri CLI resolves --config relative to its CWD, which
        # pnpm --filter sets to apps/desktop — NOT to src-tauri/. The first
        # 0.7.0 release run failed all 4 bundled jobs on exactly this: a bare
        # tauri.bundled.conf.json "does not exist" from apps/desktop.
        run: pnpm --filter @clio/desktop tauri build ${{ matrix.variant == 'bundled' && '--config src-tauri/tauri.bundled.conf.json' || '' }} ${{ matrix.bundle-args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Stage installer artifacts
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/clio-stage"
          mkdir -p "$stage"
          # Tauri lays bundles under target/release/bundle/<format>/...
          bundle_root="apps/desktop/src-tauri/target/release/bundle"
          if [ -d "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle" ]; then
            bundle_root="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          fi
          # The bundled variant shares productName/version with lite, so
          # Tauri emits identically-named installers. Tag bundled outputs
          # with a `-bundled` suffix (before the extension) so the two
          # variants are distinguishable on the Release page.
          variant='${{ matrix.variant }}'
          find "$bundle_root" -type f \( \
              -iname '*.exe' -o -iname '*.msi' -o -iname '*.dmg' \
              -o -iname '*.deb' -o -iname '*.AppImage' -o -iname '*.rpm' \
              \) -print0 | while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            if [ "$variant" = "bundled" ]; then
              ext="${base##*.}"
              stem="${base%.*}"
              dest="$stage/${stem}-bundled.${ext}"
            else
              dest="$stage/$base"
            fi
            cp -v "$f" "$dest"
          done
          ls -la "$stage"
        working-directory: ${{ github.workspace }}

      - name: Generate SHA256 sums
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/clio-stage"
          sums="SHA256SUMS.${{ matrix.target }}.${{ matrix.variant }}.txt"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > "$sums"
          else
            shasum -a 256 * > "$sums"
          fi
          cat "$sums"
        working-directory: ${{ github.workspace }}

      - name: Upload installer artifacts (per-runner)
        uses: actions/upload-artifact@v4
        with:
          name: clio-desktop-${{ matrix.variant }}-${{ matrix.target }}
          path: ${{ runner.temp }}/clio-stage/
          if-no-files-found: error

      - name: Attach installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/clio-stage/*
          generate_release_notes: true
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-web:
    name: release · pure-web zip
    if: startsWith(github.ref, 'refs/tags/clio-desktop-v')
    needs: ci
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: apps/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile=false

      - name: Build @clio/web
        run: pnpm --filter @clio/web build

      - name: Package pure-web zip
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF##*/}"
          version="${tag#clio-desktop-}"
          stage="$RUNNER_TEMP/clio-web-stage"
          mkdir -p "$stage"
          cp -r apps/web/dist "$stage/clio-web-$version"
          (cd "$stage" && zip -r "clio-web-$version.zip" "clio-web-$version")
          sha256sum "$stage/clio-web-$version.zip" \
            > "$stage/SHA256SUMS.web.txt"
        working-directory: ${{ github.workspace }}

      - name: Attach web bundle to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/clio-web-stage/clio-web-*.zip
            ${{ runner.temp }}/clio-web-stage/SHA256SUMS.web.txt
          generate_release_notes: true
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Phase 4 consumer gate: regenerate the committed TypeScript and Zod contracts
# from the exact clio-schemas revision pinned by the frontend campaign.
name: schema-ts-gen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/schema-ts-gen.yml'
      - 'packages/core/**'
      - 'scripts/generate_clio_schema_zod.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - '.github/workflows/schema-ts-gen.yml'
      - 'packages/core/**'
      - 'scripts/generate_clio_schema_zod.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ts-gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: iowarp/clio-schemas
          ref: 3224a7970d9271b2ff4ca9fe7bec2e227c4eea19
          path: .clio-schemas
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned generators
        run: |
          pnpm install --frozen-lockfile
          npm ci --prefix .clio-schemas/tools/ts-gen
      - name: Regenerate committed contracts
        run: |
          node .clio-schemas/tools/ts-gen/schemas-to-ts.mjs \
            --in .clio-schemas/src/clio_schemas/schemas \
            --out packages/core/src/generated/clio-schemas
          pnpm schema:generate:zod \
            --in .clio-schemas/src/clio_schemas/schemas \
            --out packages/core/src/generated/clio-schemas
          pnpm exec prettier --write "packages/core/src/generated/clio-schemas/*.ts"
      - name: Reject generated drift
        run: git diff --exit-code -- packages/core/src/generated/clio-schemas
      - name: Validate generated consumers
        run: |
          pnpm --filter @clio/core typecheck
          pnpm --filter @clio/core lint
          pnpm --filter @clio/core test

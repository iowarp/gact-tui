name: Release

# Publish the workspace source release after the changelog and notes gate.
# The legacy TUI is frozen and unsupported; do not build or attach its binaries.

on:
  push:
    tags:
      - "v*"

jobs:
  changelog-gate:
    # A v* tag must have a matching heading in CHANGELOG.md before we
    # cut a release. Keeps the changelog honest: no tag without an entry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main integration and curated release notes
        env:
          TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          git fetch origin main
          if ! git rev-list --first-parent FETCH_HEAD | grep -Fx "$REVISION"; then
            echo "Release ${TAG} is not a commit on main's first-parent history." >&2
            exit 1
          fi
          if ! test -s "docs/releases/${TAG}.md"; then
            echo "Curated release notes are missing for ${TAG}." >&2
            exit 1
          fi

      - name: Require a CHANGELOG entry for the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # Accept "## [0.9.4]" or "## 0.9.4" (with optional trailing text).
          if ! grep -qE "^## +\[?${version//./\\.}\]?( |$)" CHANGELOG.md; then
            echo "No CHANGELOG.md heading for version ${version} (tag ${TAG})." >&2
            echo "Add a '## [${version}]' section before tagging the release." >&2
            exit 1
          fi
          echo "CHANGELOG.md has an entry for ${version}."

  release:
    needs: changelog-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to publish the source release
    steps:
      - uses: actions/checkout@v4

      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          # A beta tag (vX.Y.Z-beta.N) is a pre-release and never becomes latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

name: docker

# Builds the three CLIO container images (clio-api, clio-web, clio-tui).
#
#  - On PRs that touch docker/** (or this workflow): build all three to verify
#    the Dockerfiles, but do NOT push.
#  - On clio-desktop-v* tags: build AND push to ghcr.io/iowarp/clio-{api,web,tui}.
#
# This is separate from apps.yml (desktop/web installers) and ci.yml (Go).

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docker/**'
      - 'tui/**'
      - 'emulator/**'
      - 'contract/**'
      - 'apps/**'
      - '.github/workflows/docker.yml'
    tags:
      - 'clio-desktop-v*'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yml'

env:
  REGISTRY: ghcr.io
  # Image namespace. Repo lives under iowarp/ on GitHub; images publish to
  # ghcr.io/iowarp/clio-{api,web,tui} on release tags.
  IMAGE_NAMESPACE: iowarp
  CLIO_REF: develop

jobs:
  build:
    name: build · ${{ matrix.image }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write   # needed to push to GHCR on tags

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: clio-api
            dockerfile: docker/Dockerfile.clio-api
          - image: clio-web
            dockerfile: docker/Dockerfile.clio-web
          - image: clio-tui
            dockerfile: docker/Dockerfile.clio-tui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in / push when building a release tag.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/clio-desktop-v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            # On a clio-desktop-v<semver> tag, publish the version + latest.
            type=match,pattern=clio-desktop-v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/clio-desktop-v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/clio-desktop-v') }}
            # On branch pushes, tag with the branch name (not pushed on PRs).
            type=ref,event=branch
            type=sha,format=short

      - name: Build (and push on tags)
        uses: docker/build-push-action@v6
        with:
          # Build context is the REPO ROOT: the TUI image needs the go.work
          # workspace and the web image needs the apps/ pnpm workspace.
          context: .
          file: ${{ matrix.dockerfile }}
          # Push only for release tags; PRs and branch pushes build-only.
          push: ${{ startsWith(github.ref, 'refs/tags/clio-desktop-v') }}
          build-args: |
            CLIO_REF=${{ env.CLIO_REF }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions layer cache keeps rebuilds fast across runs.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run on the same ref when a new push lands —
# saves CI minutes on rapid-fire commits while iterating.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.module }} (test -race)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each module gets its own job so failures stay isolated and
        # you can see at a glance which one regressed.
        module:
          - emulator
          - tui
          - adapters/opencode
          - adapters/crush
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pinned to the toolchain we develop against. The repo's
          # go.work declares 1.25.8; setup-go honours go.mod's go
          # directive when this is "stable", so we set it explicitly.
          go-version: '1.25.x'
          # go.mod is always present; setup-go falls back to it when
          # go.sum is missing (the no-external-deps modules don't have
          # one). Hashing go.mod still gives a stable cache key.
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: go mod download
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: go test -race
        working-directory: ${{ matrix.module }}
        # -count=1 disables Go's test cache so a flake fixed by a
        # later commit can't poison results. Most jobs run in <30 s
        # so the cost is negligible.
        run: go test -race -count=1 ./...

  vet:
    name: go vet
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - emulator
          - tui
          - adapters/opencode
          - adapters/crush
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          # go.mod is always present; setup-go falls back to it when
          # go.sum is missing (the no-external-deps modules don't have
          # one). Hashing go.mod still gives a stable cache key.
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

  build:
    name: build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: emulator/go.mod
      - name: build emulator
        working-directory: emulator
        run: go build -o /tmp/emulator-server ./cmd/emulator-server
      - name: build tui
        working-directory: tui
        run: go build -o /tmp/gact .
      - name: build opencode adapter
        working-directory: adapters/opencode
        run: go build -o /tmp/gact-opencode-adapter ./cmd/gact-opencode-adapter
      - name: build crush adapter
        working-directory: adapters/crush
        run: go build -o /tmp/gact-crush-adapter ./cmd/gact-crush-adapter

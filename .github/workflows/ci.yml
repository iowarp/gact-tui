name: CI

on:
  push:
    branches: [main, develop]
    # Pure media/doc changes don't affect any built or tested code — but
    # contract/SPEC.md IS the source the Go/TS vocabulary gates enforce, so
    # re-include it (ordered negation: last matching pattern wins).
    paths:
      - "**"
      - "!**.png"
      - "!**.gif"
      - "!**.md"
      - "!screenshots/**"
      - "!docs/**"
      - "contract/SPEC.md"
  pull_request:
    branches: [main, develop]
    paths:
      - "**"
      - "!**.png"
      - "!**.gif"
      - "!**.md"
      - "!screenshots/**"
      - "!docs/**"
      - "contract/SPEC.md"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Match the toolchain pinned in go.work.
          go-version: "1.26.x"
          cache-dependency-path: |
            **/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to run on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      # The repo root is a go.work workspace, not a module, so
      # `go <cmd> ./...` from the root doesn't span the members.
      # Run vet / build / test inside each workspace module instead;
      # the module list is read from go.work so it stays in sync as
      # modules are added or removed.
      - name: Build, vet, and test each workspace module
        run: |
          set -e
          for m in $(grep -oE '\./[^ ]+' go.work); do
            echo "::group::$m"
            ( cd "$m" && go vet ./... && go build ./... && go test ./... -count=1 )
            echo "::endgroup::"
          done

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Match the toolchain pinned in go.work.
          go-version: "1.26.x"
          cache-dependency-path: |
            **/go.sum

      - name: Verify dev install paths and version metadata
        run: |
          make dev-install
          make verify-dev-install
          gact version

  python-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/claude-agent-sdk-server
    steps:
      - uses: actions/checkout@v4

      # Per-job path filter: only exercise the adapter when its
      # directory changed (GitHub has no native per-job `paths`).
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            adapter:
              - "adapters/claude-agent-sdk-server/**"

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.adapter == 'true'
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        if: steps.changes.outputs.adapter == 'true'

      - name: Install dependencies
        if: steps.changes.outputs.adapter == 'true'
        run: uv sync

      # Hermetic subset only: the test_smoke_*.py files require a real
      # `claude` CLI install (they self-skip without it). test_bridge.py
      # and test_endpoints.py are deterministic and offline.
      - name: Run hermetic tests
        if: steps.changes.outputs.adapter == 'true'
        run: uv run pytest tests/test_bridge.py tests/test_endpoints.py
